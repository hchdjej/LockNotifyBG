name: Build LockNotifyBG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build rootless deb (iOS 16.5)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid xz make coreutils

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Install iOS 16.5 SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          cd /tmp
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          cp -R iPhoneOS16.5.sdk "$HOME/theos/sdks/"

      - name: Build
        id: build
        run: |
          export THEOS=$HOME/theos
          export PATH="$THEOS/bin:$PATH"
          set +e
          make clean > /tmp/build.log 2>&1
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless >> /tmp/build.log 2>&1
          RC=$?
          set -e

          echo "make 退出码: $RC"
          echo "===== 日志尾部 ====="
          tail -60 /tmp/build.log

          # 汇总诊断，无论成败都写进 summary
          {
            echo "## 构建结果"
            echo "make 退出码: \`$RC\`"
            echo ""
            echo "### 产物查找"
            echo '```'
            find . -name "*.deb" -not -path "./.git/*" 2>/dev/null || echo "(无)"
            echo '```'
            echo "### 关键错误"
            echo '```'
            grep -iE "error:|fatal|Error [0-9]" /tmp/build.log 2>/dev/null | head -40 || echo "(无)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

          if [ "$RC" -ne 0 ]; then
            echo "::error::编译失败，退出码 $RC"
            exit 1
          fi

      - name: Package artifact
        run: |
          set -e
          DEB=$(find . -name "*.deb" -not -path "./.git/*" | head -n1)
          if [ -z "$DEB" ]; then
            echo "::error::未找到 deb 产物"
            find . -maxdepth 3 -type d -not -path "./.git*" | head -40
            tail -80 /tmp/build.log
            exit 1
          fi
          echo "找到产物: $DEB"
          ls -lh "$DEB"
          cp "$DEB" "$GITHUB_WORKSPACE/LockNotifyBG-rootless.deb"
          shasum -a 256 LockNotifyBG-rootless.deb | tee checksum.txt

          # 生成含文件清单的 Release 说明
          {
            echo "自动编译产物（iOS 16.5 / iphoneos-arm64 / rootless / Dopamine）"
            echo ""
            echo "## 校验和（SHA256）"
            echo '```'
            cat checksum.txt
            echo '```'
            echo "## 包内文件清单"
            echo '```'
            if [ -x "$HOME/theos/bin/dpkg-deb" ]; then
              "$HOME/theos/bin/dpkg-deb" -c LockNotifyBG-rootless.deb || true
            else
              mkdir -p /tmp/deblist && cd /tmp/deblist && rm -f control.tar.* data.tar.*
              ar x "$GITHUB_WORKSPACE/LockNotifyBG-rootless.deb"
              for f in data.tar.xz data.tar.gz data.tar.lzma; do
                if [ -f "$f" ]; then
                  case "$f" in
                    *.xz)  xz -dc "$f" | tar -tf - ;;
                    *.gz)  tar -tzf "$f" ;;
                    *.lzma) xz --format=lzma -dc "$f" | tar -tf - ;;
                  esac
                fi
              done
            fi
            echo '```'
          } > release-notes.md
          {
            echo "## 产物信息"
            echo '```'
            ls -lh LockNotifyBG-rootless.deb
            cat checksum.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: LockNotifyBG-rootless
          path: |
            LockNotifyBG-rootless.deb
            checksum.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.1.0-build.${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "LockNotifyBG $TAG" \
            --notes-file release-notes.md \
            LockNotifyBG-rootless.deb checksum.txt \
            || gh release upload "$TAG" LockNotifyBG-rootless.deb checksum.txt --clobber

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "构建失败 — run ${{ github.run_id }}"
            echo ""
            echo "### 错误行"
            grep -iE "error:|fatal|Error [0-9]|No such|not found" /tmp/build.log 2>/dev/null | head -50 || echo "(无)"
            echo ""
            echo "### 日志尾部"
            tail -80 /tmp/build.log 2>/dev/null || echo "(无日志)"
          } > /tmp/diag.txt
          gh issue create --repo "${{ github.repository }}" \
            --title "build-failure-${{ github.run_id }}" \
            --body-file /tmp/diag.txt || true
