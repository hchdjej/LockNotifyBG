name: Build LockNotifyBG

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '_artifacts/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build rootless deb (iOS 16.5)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid xz make coreutils

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Install iOS 16.5 SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          cd /tmp
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          cp -R iPhoneOS16.5.sdk "$HOME/theos/sdks/"

      - name: Build
        run: |
          export THEOS=$HOME/theos
          export PATH="$THEOS/bin:$PATH"
          set +e
          make clean > /tmp/build.log 2>&1
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless >> /tmp/build.log 2>&1
          RC=$?
          set -e
          tail -60 /tmp/build.log
          if [ "$RC" -ne 0 ]; then
            echo "::error::编译失败，退出码 $RC"
            exit 1
          fi

      - name: Package artifact
        run: |
          exec > >(tee /tmp/pkg.log) 2>&1
          DEB=$(find . -name "*.deb" -not -path "./.git/*" | head -n1)
          if [ -z "$DEB" ]; then
            echo "::error::未找到 deb 产物"
            find . -maxdepth 3 -type d -not -path "./.git*" | head -40
            exit 1
          fi
          echo "找到产物: $DEB"
          ls -lh "$DEB"
          cp "$DEB" "$GITHUB_WORKSPACE/LockNotifyBG-rootless.deb"
          shasum -a 256 LockNotifyBG-rootless.deb | tee checksum.txt

          # 生成含文件清单的 Release 说明（失败不影响产物上传）
          echo "自动编译产物（iOS 16.5 / iphoneos-arm64 / rootless / Dopamine）" > release-notes.md
          echo "" >> release-notes.md
          echo "## 校验和（SHA256）" >> release-notes.md
          echo '```' >> release-notes.md
          cat checksum.txt >> release-notes.md
          echo '```' >> release-notes.md
          echo "## 包内文件清单" >> release-notes.md
          echo '```' >> release-notes.md
          LIST_OK=0
          if command -v dpkg-deb >/dev/null 2>&1; then
            if dpkg-deb -c LockNotifyBG-rootless.deb; then LIST_OK=1; fi
          fi
          if [ "$LIST_OK" != 1 ] && [ -x "$HOME/theos/bin/dpkg-deb" ]; then
            if "$HOME/theos/bin/dpkg-deb" -c LockNotifyBG-rootless.deb; then LIST_OK=1; fi
          fi
          if [ "$LIST_OK" != 1 ]; then
            echo "(无 dpkg-deb，用 ar 解包列出)" 
            mkdir -p /tmp/deblist
            (
              cd /tmp/deblist
              rm -rf control.tar.* data.tar.* 2>/dev/null
              ar x "$GITHUB_WORKSPACE/LockNotifyBG-rootless.deb"
              for f in data.tar.xz data.tar.gz data.tar.lzma data.tar.bz2; do
                [ -f "$f" ] || continue
                case "$f" in
                  *.xz)   xz -dc "$f" | tar -tf - ;;
                  *.gz)   tar -tzf "$f" ;;
                  *.lzma) xz --format=lzma -dc "$f" | tar -tf - ;;
                  *.bz2)  tar -tjf "$f" ;;
                esac
              done
            ) && LIST_OK=1
          fi
          [ "$LIST_OK" = 1 ] || echo "(清单生成失败，但 deb 本身正常)"
          echo '```' >> release-notes.md
          echo "---- release-notes.md 预览 ----"
          cat release-notes.md

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: LockNotifyBG-rootless
          path: |
            LockNotifyBG-rootless.deb
            checksum.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.1.0-build.${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "LockNotifyBG $TAG" \
            --notes-file release-notes.md \
            LockNotifyBG-rootless.deb checksum.txt \
            || gh release upload "$TAG" LockNotifyBG-rootless.deb checksum.txt --clobber

      # 把 deb 以 base64 分片提交进仓库，供无法访问 Release/Artifact
      # （Azure 存储域名被墙）的环境经由 api.github.com 取回。
      # 该步骤失败不影响构建结论。
      - name: Commit deb as base64 chunks
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p _artifacts
          rm -f _artifacts/*.b64 _artifacts/manifest.txt 2>/dev/null || true
          split -b 20000 -d -a 3 LockNotifyBG-rootless.deb _artifacts/deb.part.
          for f in _artifacts/deb.part.*; do
            base64 -i "$f" | tr -d '\n' > "$f.b64"
            rm -f "$f"
          done
          shasum -a 256 LockNotifyBG-rootless.deb | awk '{print $1}' > _artifacts/sha256.txt
          SIZE=$(stat -f%z LockNotifyBG-rootless.deb)
          PARTS=$(ls _artifacts/deb.part.*.b64 | wc -l | tr -d ' ')
          printf 'size=%s\nparts=%s\nchunk_bytes=20000\n' "$SIZE" "$PARTS" > _artifacts/manifest.txt
          cat _artifacts/manifest.txt
          ls -la _artifacts/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f _artifacts
          git commit -m "chore(ci): 提交 deb base64 分片 (run ${{ github.run_id }})" || exit 0
          git push origin HEAD:main

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "构建失败 — run ${{ github.run_id }}"
            echo ""
            echo "### pkg.log（产物步骤日志）"
            echo '```'
            tail -60 /tmp/pkg.log 2>/dev/null || echo "(无)"
            echo '```'
            echo "### build.log 错误行"
            grep -iE "error:|fatal|Error [0-9]" /tmp/build.log 2>/dev/null | head -40 || echo "(无)"
            echo ""
            echo "### build.log 尾部"
            echo '```'
            tail -60 /tmp/build.log 2>/dev/null || echo "(无)"
            echo '```'
          } > /tmp/diag.txt
          gh issue create --repo "${{ github.repository }}" \
            --title "build-failure-${{ github.run_id }}" \
            --body-file /tmp/diag.txt || true
