name: Build LockNotifyBG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build rootless deb (iOS 16.5)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid xz make coreutils
          echo "依赖安装完成"

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "Theos 克隆完成"
          ls "$THEOS" | head

      - name: Install iOS 16.5 SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p "$THEOS/sdks"
          cd /tmp
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          cp -R iPhoneOS16.5.sdk "$THEOS/sdks/"
          echo "已安装 SDK:"
          ls "$THEOS/sdks"

      - name: Build rootless package
        id: build
        continue-on-error: true
        run: |
          export THEOS=$HOME/theos
          export PATH="$THEOS/bin:$PATH"
          set +e
          make clean > /tmp/build.log 2>&1
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless >> /tmp/build.log 2>&1
          RC=$?
          set -e
          echo "make package 退出码: $RC"
          echo "===== 构建日志（尾部 120 行）====="
          tail -120 /tmp/build.log
          echo ""
          echo "===== packages 目录 ====="
          ls -lah packages/ 2>&1 || echo "packages 目录不存在"
          echo "===== 全仓 deb 查找 ====="
          find . -name "*.deb" -not -path "./.git/*" 2>&1 || echo "无 deb"
          if [ "$RC" -ne 0 ]; then
            echo "::error::make 失败，退出码 $RC"
            exit 1
          fi

      - name: Publish build log to summary
        if: always()
        run: |
          {
            echo "## 构建日志"
            echo '```'
            tail -150 /tmp/build.log 2>/dev/null || echo "无日志"
            echo '```'
            echo "### 关键错误行"
            echo '```'
            grep -iE "error|fatal|No such|not found|Error [0-9]" /tmp/build.log 2>/dev/null | head -40 || echo "无匹配"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          cp /tmp/build.log build.log 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Report failure to issue (readable via API)
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "构建失败诊断 — run ${{ github.run_id }}"
            echo ""
            echo "### 关键错误"
            grep -iE "error|fatal|No such|not found|Error [0-9]|undefined" /tmp/build.log 2>/dev/null | head -60 || echo "(无匹配)"
            echo ""
            echo "### 完整日志尾部"
            tail -100 /tmp/build.log 2>/dev/null
          } > /tmp/issue_body.txt
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "build-failure-${{ github.run_id }}" \
            --body-file /tmp/issue_body.txt || true

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Locate deb output
        id: locate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "---- 查找所有 deb ----"
          find . -name "*.deb" -not -path "./.git/*" 2>/dev/null || true
          echo "---- packages 目录 ----"
          ls -lah packages/ 2>&1 || echo "packages 不存在"
          DEB=$(find . -name "*.deb" -not -path "./.git/*" 2>/dev/null | head -n1)
          if [ -z "$DEB" ]; then
            echo "::error::未找到 deb 产物"
            {
              echo "未找到 deb 产物 — run ${{ github.run_id }}"
              echo ""
              echo "### 目录结构"
              find . -maxdepth 3 -type d -not -path "./.git*" 2>/dev/null | head -40
              echo ""
              echo "### 构建日志尾部"
              tail -80 /tmp/build.log 2>/dev/null
            } > /tmp/diag.txt
            gh issue create --repo "${{ github.repository }}" \
              --title "no-deb-${{ github.run_id }}" --body-file /tmp/diag.txt || true
            exit 1
          fi
          echo "$DEB" > /tmp/deb_path.txt
          echo "找到: $DEB"

      - name: Show package info
        run: |
          DEB=$(cat /tmp/deb_path.txt)
          echo "包路径: $DEB"
          dpkg-deb -I "$DEB"
          echo "---- 文件清单 ----"
          dpkg-deb -c "$DEB"
          cp "$DEB" ./LockNotifyBG.deb
          echo "已复制到:", ./LockNotifyBG.deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockNotifyBG-rootless
          path: LockNotifyBG.deb
          if-no-files-found: error
          retention-days: 90
